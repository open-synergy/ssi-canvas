          route_id: "EVAL: registry['canvas_route'].id"
          outbound_location_id: "EVAL: registry['warehouse'].lot_stock_id.id"
          inbound_location_id: "EVAL: registry['warehouse'].lot_stock_id.id"
          pricelist_id: "REF: product.list0"
