scenarios:
  - name: "Sale Canvas Type - Create and verify basic fields"
    steps:
      - step: "Create canvas type"
        action: "create"
        model: "sale_canvas_type"
        save_as: "canvas_type"
        values:
          name: "Test Canvas Type"
          code: "TCT001"

      - step: "Assert type created and active"
        action: "assert"
        target: "canvas_type"
        asserts:
          active:
            type: "value"
            expected: true
          name:
            type: "value"
            expected: "Test Canvas Type"

  - name: "Sale Canvas - Full lifecycle draft to open with procurement group"
    steps:
      - step: "Setup - get default warehouse"
        action: "ref"
        xml_id: "stock.warehouse0"
        save_as: "warehouse"

      - step: "Setup - create inbound route"
        action: "create"
        model: "stock.location.route"
        save_as: "inbound_route"
        values:
          name: "Test Inbound Route Canvas Lifecycle"

      - step: "Setup - create outbound route"
        action: "create"
        model: "stock.location.route"
        save_as: "outbound_route"
        values:
          name: "Test Outbound Route Canvas Lifecycle"

      - step: "Setup - create canvas route"
        action: "create"
        model: "stock.location.route"
        save_as: "canvas_route"
        values:
          name: "Test Canvas Route Lifecycle"

      - step: "Setup - create product template"
        action: "create"
        model: "product.template"
        save_as: "product_template"
        values:
          name: "Test Canvas Product Lifecycle"
          type: "service"

      - step: "Search product variant"
        action: "search"
        model: "product.product"
        domain:
          - ["product_tmpl_id", "=", "EVAL: registry['product_template'].id"]
        save_as: "product"
        limit: 1

      - step: "Get UoM unit"
        action: "ref"
        xml_id: "uom.product_uom_unit"
        save_as: "uom_unit"

      - step: "Setup - get admin user"
        action: "ref"
        xml_id: "base.user_admin"
        save_as: "admin_user"

      - step: "Setup - get admin user partner"
        action: "search"
        model: "res.partner"
        domain:
          - ["id", "=", "EVAL: registry['admin_user'].partner_id.id"]
        save_as: "admin_partner"
        limit: 1

      - step: "Setup - set canvas location on admin partner"
        action: "write"
        target: "admin_partner"
        values:
          canvas_location_id: "EVAL: registry['warehouse'].lot_stock_id.id"

      - step: "Setup - create canvas type"
        action: "create"
        model: "sale_canvas_type"
        save_as: "canvas_type"
        values:
          name: "Test Canvas Type Lifecycle"
          code: "TCTLC"

      - step: "Create sale canvas with line to keep draft state"
        action: "create"
        model: "sale_canvas"
        save_as: "canvas"
        as_user: "base.user_admin"
        values:
          type_id: "EVAL: registry['canvas_type'].id"
          outbound_warehouse_id: "EVAL: registry['warehouse'].id"
          inbound_warehouse_id: "EVAL: registry['warehouse'].id"
          inbound_route_id: "EVAL: registry['inbound_route'].id"
          outbound_route_id: "EVAL: registry['outbound_route'].id"
          route_id: "EVAL: registry['canvas_route'].id"
          outbound_location_id: "EVAL: registry['warehouse'].lot_stock_id.id"
          inbound_location_id: "EVAL: registry['warehouse'].lot_stock_id.id"
          pricelist_id: "REF: product.list0"
          currency_id: "REF: base.USD"
          salesperson_id: "REF: base.user_admin"
          line_ids:
            - - 0
              - 0
              - product_id: "EVAL: registry['product'].id"
                uom_id: "EVAL: registry['uom_unit'].id"
                uom_quantity: 10.0
                name: "Lifecycle Test Line"

      - step: "Assert canvas created in draft"
        action: "assert"
        target: "canvas"
        asserts:
          state:
            type: "value"
            expected: "draft"
          uom_quantity:
            type: "value"
            expected: 10.0
          deliver_ok:
            type: "value"
            expected: false
          receipt_ok:
            type: "value"
            expected: false

      - step: "Confirm canvas"
        action: "call"
        target: "canvas"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Invalidate cache after confirm"
        action: "call"
        target: "canvas"
        method: "invalidate_cache"

      - step: "Approve canvas to open"
        action: "call"
        target: "canvas"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Invalidate cache after open"
        action: "call"
        target: "canvas"
        method: "invalidate_cache"

      - step: "Assert canvas is open with procurement group"
        action: "assert"
        target: "canvas"
        asserts:
          state:
            type: "value"
            expected: "open"
          procurement_group_id:
            type: "value"
            operator: "is_truthy"

  - name: "Sale Canvas - With lines and computed quantity aggregation"
    steps:
      - step: "Setup - get default warehouse"
        action: "ref"
        xml_id: "stock.warehouse0"
        save_as: "warehouse"

      - step: "Setup - create routes"
        action: "create"
        model: "stock.location.route"
        save_as: "inbound_route"
        values:
          name: "Test Inbound Route Canvas Lines"

      - step: "Setup - create outbound route"
        action: "create"
        model: "stock.location.route"
        save_as: "outbound_route"
        values:
          name: "Test Outbound Route Canvas Lines"

      - step: "Setup - create canvas route"
        action: "create"
        model: "stock.location.route"
        save_as: "canvas_route"
        values:
          name: "Test Canvas Route Lines"

      - step: "Setup - create product template"
        action: "create"
        model: "product.template"
        save_as: "product_template"
        values:
          name: "Test Canvas Product Lines"
          type: "product"

      - step: "Search product variant"
        action: "search"
        model: "product.product"
        domain:
          - ["product_tmpl_id", "=", "EVAL: registry['product_template'].id"]
        save_as: "product"
        limit: 1

      - step: "Get UoM unit"
        action: "ref"
        xml_id: "uom.product_uom_unit"
        save_as: "uom_unit"

      - step: "Setup - create canvas type"
        action: "create"
        model: "sale_canvas_type"
        save_as: "canvas_type"
        values:
          name: "Test Canvas Type Lines"
          code: "TCTL"

      - step: "Create canvas with initial line"
        action: "create"
        model: "sale_canvas"
        save_as: "canvas"
        as_user: "base.user_admin"
        values:
          type_id: "EVAL: registry['canvas_type'].id"
          outbound_warehouse_id: "EVAL: registry['warehouse'].id"
          inbound_warehouse_id: "EVAL: registry['warehouse'].id"
          inbound_route_id: "EVAL: registry['inbound_route'].id"
          outbound_route_id: "EVAL: registry['outbound_route'].id"
          route_id: "EVAL: registry['canvas_route'].id"
          outbound_location_id: "EVAL: registry['warehouse'].lot_stock_id.id"
          inbound_location_id: "EVAL: registry['warehouse'].lot_stock_id.id"
          pricelist_id: "REF: product.list0"
          currency_id: "REF: base.USD"
          salesperson_id: "REF: base.user_admin"
          line_ids:
            - - 0
              - 0
              - product_id: "EVAL: registry['product'].id"
                uom_id: "EVAL: registry['uom_unit'].id"
                uom_quantity: 10.0
                name: "Initial Line"

      - step: "Assert canvas is in draft with initial line qty"
        action: "assert"
        target: "canvas"
        asserts:
          state:
            type: "value"
            expected: "draft"
          uom_quantity:
            type: "value"
            expected: 10.0

      - step: "Add second canvas line"
        action: "create"
        model: "sale_canvas_line"
        save_as: "line2"
        values:
          canvas_id: "EVAL: registry['canvas'].id"
          product_id: "EVAL: registry['product'].id"
          uom_id: "EVAL: registry['uom_unit'].id"
          uom_quantity: 5.0
          name: "Test Canvas Line 2"

      - step: "Invalidate cache after line creation"
        action: "call"
        target: "canvas"
        method: "invalidate_cache"

      - step: "Assert total uom_quantity aggregated from lines"
        action: "assert"
        target: "canvas"
        asserts:
          uom_quantity:
            type: "value"
            expected: 15.0

      - step: "Assert canvas has two lines"
        action: "assert"
        target: "canvas"
        asserts:
          line_ids:
            type: "o2m"
            check: "count"
            expected_count: 2

      - step: "Assert percent_delivered is zero with no deliveries"
        action: "assert"
        target: "canvas"
        asserts:
          percent_delivered:
            type: "value"
            expected: 0.0

      - step: "Assert qty_to_deliver equals total qty"
        action: "assert"
        target: "canvas"
        asserts:
          qty_to_deliver:
            type: "value"
            expected: 15.0

