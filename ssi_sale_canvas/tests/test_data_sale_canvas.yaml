        save_as: "inbound_route"
        values:
          name: "Test Inbound Route Realization"

      - step: "Setup - create outbound route"
        action: "create"
        model: "stock.location.route"
        save_as: "outbound_route"
        values:
          name: "Test Outbound Route Realization"

      - step: "Setup - create canvas route"
        action: "create"
        model: "stock.location.route"
        save_as: "canvas_route"
        values:
          name: "Test Canvas Route Realization"

      - step: "Setup - create product"
        action: "create"
        model: "product.template"
        save_as: "product_template"
        values:
