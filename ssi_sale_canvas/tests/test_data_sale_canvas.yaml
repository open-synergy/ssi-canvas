      - step: "Setup - get admin user"
        action: "ref"
        xml_id: "base.user_admin"
        save_as: "admin_user"

      - step: "Setup - get admin user partner"
        action: "search"
        model: "res.partner"
        domain:
          - ["id", "=", "EVAL: registry['admin_user'].partner_id.id"]
        save_as: "admin_partner"
        limit: 1

      - step: "Setup - set canvas location on admin partner"
        action: "write"
