              - product_id: "EVAL: registry['product'].id"
                uom_id: "EVAL: registry['uom_unit'].id"
                uom_quantity: 20.0
                name: "Realization Test Line"

      - step: "Confirm canvas"
        action: "call"
        target: "canvas"
        method: "action_confirm"
        as_user: "base.user_admin"

      - step: "Invalidate cache after confirm"
